name: Setup Tool Test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'setup_ui.cpp'
      - 'Makefile'
      - '*.sh'
      - 'tests/**'
      - '.github/workflows/test-setup.yml'
  push:
    branches: [main]
    paths:
      - 'setup_ui.cpp'
      - 'Makefile'
      - '*.sh'
      - 'tests/**'
      - '.github/workflows/test-setup.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build on Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev

      - name: Check shell syntax
        run: bash -n ./*.sh tests/*.sh

      - name: Compile
        run: make

      - name: Upload setup tool
        uses: actions/upload-artifact@v4
        with:
          name: setup-tool
          path: setup_tool
          if-no-files-found: error

  cli-test:
    name: CLI selection and failure handling
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download setup tool
        uses: actions/download-artifact@v4
        with:
          name: setup-tool

      - name: Test CLI
        run: |
          chmod +x setup_tool
          bash tests/test_cli.sh ./setup_tool

  preflight:
    name: Check ${{ matrix.task }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        task:
          - neovim
          - screen
          - nodejs
          - ruby
          - golang
          - dlang
          - rust
          - docker
          - tmux
          - atcoder
          - config
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download setup tool
        uses: actions/download-artifact@v4
        with:
          name: setup-tool

      - name: Install AtCoder check dependency
        if: matrix.task == 'atcoder'
        run: sudo apt-get update && sudo apt-get install -y python3-venv

      - name: Run non-destructive check
        env:
          CHECK_HOME: ${{ runner.temp }}/setup-check-home
        run: |
          chmod +x setup_tool
          mkdir -p "$CHECK_HOME"
          HOME="$CHECK_HOME" ./setup_tool --check --task "${{ matrix.task }}" --source-dir "$GITHUB_WORKSPACE"
          test -z "$(find "$CHECK_HOME" -mindepth 1 -print -quit)"

  release:
    name: Publish latest build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, cli-test, preflight]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download tested setup tool
        uses: actions/download-artifact@v4
        with:
          name: setup-tool

      - name: Release binary
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          files: setup_tool
          draft: false
          prerelease: false
